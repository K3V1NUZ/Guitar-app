<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fretbook — guitar theory, offline</title>
  <meta name="description" content="Chord library, chord & scale identifiers, scales on the fretboard, circle of fifths, progressions, tuner, metronome and ear training. Works fully offline.">
  <meta name="theme-color" content="#ececee">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preload" href="assets/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // apply theme before first paint
    try { var t = JSON.parse(localStorage.getItem('fretbook.settings') || '{}').theme; if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><noscript>Fretbook needs JavaScript.</noscript></div>

  <script src="js/theory.js"></script>
  <script src="js/voicings.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/render.js"></script>
  <script>window.GA.views = [];</script>
  <script src="js/views/home.js"></script>
  <script src="js/views/library.js"></script>
  <script src="js/views/identify.js"></script>
  <script src="js/views/scales.js"></script>
  <script src="js/views/scaleid.js"></script>
  <script src="js/views/harmonize.js"></script>
  <script src="js/views/chordscales.js"></script>
  <script src="js/views/circle.js"></script>
  <script src="js/views/fretboard.js"></script>
  <script src="js/views/progressions.js"></script>
  <script src="js/views/tuner.js"></script>
  <script src="js/views/metronome.js"></script>
  <script src="js/views/transpose.js"></script>
  <script src="js/views/ear.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
